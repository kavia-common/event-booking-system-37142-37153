[tool.black]
line-length = 100
target-version = ["py310"]
skip-string-normalization = false
exclude = """
/(
    \.git
  | \.venv
  | build
  | dist
)/
"""

[tool.isort]
profile = "black"
line_length = 100
force_sort_within_sections = true
combine_as_imports = true
include_trailing_comma = true
multi_line_output = 3

[tool.coverage.run]
branch = true
source = ["."]
